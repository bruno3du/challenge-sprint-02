<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <link rel="stylesheet" href="/styles/tokens.css" />
    <link rel="stylesheet" href="/styles/rewards.css" />
    <script src="./script/rewards.js"></script>

    <title>Recompensas</title>
  </head>

<body>
    <div class="d-flex min-vh-100">
      <aside class="nav-rail d-flex flex-column align-items-center gap-2 py-3">
        <div class="nav-brand mb-3">E</div>
        <a class="nav-item" href="home.html" title="Início" aria-label="Início">
          <i class="bi bi-house-door-fill"></i>
        </a>
        <a class="nav-item" href="agendamento.html" title="Agendar" aria-label="Agendar">
          <i class="bi bi-calendar-plus"></i>
        </a>
        <a class="nav-item" href="consultas.html" title="Consultas" aria-label="Consultas">
          <i class="bi bi-clock-history"></i>
        </a>
        <a class="nav-item active" href="rewards.html" title="Recompensas" aria-label="Recompensas">
          <i class="bi bi-gift"></i>
        </a>
        <a class="nav-item" href="perfil.html" title="Perfil" aria-label="Perfil">
          <i class="bi bi-person-circle"></i>
        </a>
      </aside>

      <main class="flex-fill d-flex flex-column min-w-0">
        <header class="topbar d-flex align-items-center gap-3 px-5">
          <div class="flex-grow-1">
            <h1 class="m-0">Recompensas</h1>
            <div class="text-muted-ink small">Terça-feira, 17 de julho de 2026</div>
          </div>
          <input
            type="text"
            class="input input-search"
            placeholder="Pesquisar"
            aria-label="Pesquisar"
          />
          <button type="button" class="btn btn-icon rounded-pill" aria-label="Notificações">
            <i class="bi bi-bell"></i>
          </button>
          <button id="dark-toggle" class="btn btn-icon rounded-pill" aria-label="Alternar tema">
            <i class="bi bi-moon"></i>
          </button>
          <div class="avatar avatar-gradient">B</div>
        </header>

        <div class="benefits-bar">
          <h2>🎉 Resgatar benefícios ✨</h2>
        </div>

        <main id="content-fundo">
          <button class="points-bar">
            
            <div class="points-left">
              <span class="points-title">Pontos acumulados</span>
              <div class="points-value-row">
                <span class="points-value">3.000</span>
                <span class="points-icon">P</span>
              </div>
            </div>
            <div class="points-right">
              <a href="/program" id="link-rewards">Saiba mais sobre o Programa de Sucesso Cooperativo</a>
            </div>
          </button>

          <div class="rewards-grid">
            <div class="reward-card green">
              <h3>Até 15% de desconto em Exames</h3>
              <img src="./assets/img/261-2614450_airport-clip-art-black-and-white-download-chemical-reactions-clipart-black-and (1).png" alt="Exames" class="card-icon-potion">
              <button class="redeem-btn">Resgatar</button>
              <p class="cost">Custo: <b>950 °</b></p>
            </div>

            <div class="reward-card blue">
              <h3>Até 20% de desconto em Consultas</h3>
              <img src="./assets/img/png-transparent-stethoscope-stethoscope-illustration-planner-icon-dr-logo-dr-appointment-icon.png" alt="Consultas" class="card-icon">
              <button class="redeem-btn">Resgatar</button>
              <p class="cost">Custo: <b>1200 °</b></p>
            </div>

            <div class="reward-card yellow">
              <h3>Até 10% de desconto em Odontologia</h3>
              <img src="./assets/img/103386 (1).png" alt="Odontologia" class="card-icon">
              <button class="redeem-btn">Resgatar</button>
              <p class="cost">Custo: <b>800 °</b></p>
            </div>

            <div class="reward-card red">
              <h3>Até 5% de desconto em Cirurgias</h3>
              <img src="./assets/img/heart-icon-md (1).png" alt="Cirurgias" class="card-icon-heart">
              <button class="redeem-btn">Resgatar</button>
              <p class="cost">Custo: <b>1500 °</b></p>
            </div>
          </div>
      </main>
      <div class="points-actions">
  <button id="reset-points" class="btn btn-secondary rounded-pill">
    Resetar pontos
  </button>
</div>
    </div>
    
</body>
</html>
