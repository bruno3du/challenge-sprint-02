<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <link rel="stylesheet" href="./styles/home.css" />
    <link rel="stylesheet" href="./styles/tokens.css" />
    <script src="./scripts/common.js" defer></script>
    <script src="./scripts/home.js" defer></script>

    <title>Início</title>
  </head>

  <body>
    <div class="d-flex min-vh-100">
      <aside class="nav-rail d-flex flex-column align-items-center gap-2 py-3">
        <div class="nav-brand mb-3">E</div>
        <a class="nav-item active" href="home.html" title="Início" aria-label="Início">
          <i class="bi bi-house-door-fill"></i>
        </a>
        <a class="nav-item" href="agendamento.html" title="Agendar" aria-label="Agendar">
          <i class="bi bi-calendar-plus"></i>
        </a>
        <a class="nav-item" href="consultas.html" title="Consultas" aria-label="Consultas">
          <i class="bi bi-clock-history"></i>
        </a>
        <a class="nav-item" href="rewards.html" title="Recompensas" aria-label="Recompensas">
          <i class="bi bi-gift"></i>
        </a>
        <a class="nav-item" href="perfil.html" title="Perfil" aria-label="Perfil">
          <i class="bi bi-person-circle"></i>
        </a>
      </aside>

      <main class="flex-fill d-flex flex-column min-w-0">
        <header class="topbar d-flex align-items-center gap-3 px-5">
          <div class="flex-grow-1">
            <h1 class="m-0">Início</h1>
            <div class="text-muted-ink small">
              Terça-feira, 17 de julho de 2026
            </div>
          </div>
          <input
            type="text"
            class="input input-search"
            placeholder="Pesquisar"
            aria-label="Pesquisar"
          />
          <button
            type="button"
            class="btn btn-icon rounded-pill"
            aria-label="Notificações"
          >
            <i class="bi bi-bell"></i>
          </button>
          <button
            id="dark-toggle"
            class="btn btn-icon rounded-pill"
            aria-label="Alternar tema"
          >
            <i class="bi bi-moon"></i>
          </button>
          <div class="avatar avatar-gradient">B</div>
        </header>

        <main id="content-fundo">
          <h2 class="contenth2">O que você gostaria de agendar?</h2>
          <div class="opcoes">
            <button id="card-consulta">
              <span class="cardtext">Agendar consulta</span>
              <img
                src="./assets/img/png-transparent-stethoscope-stethoscope-illustration-planner-icon-dr-logo-dr-appointment-icon.png"
                alt="Estetoscópio"
                class="card-icon"
              />
            </button>
            <button id="card-cirurgia">
              <span class="cardtext">Agendar cirurgia</span>
              <img
                src="./assets/img/heart-icon-md (1).png"
                alt="Coração"
                class="card-icon-heart"
              />
            </button>
            <button id="card-odontologia">
              <span class="cardtext">Agendar dentista</span>
              <img
                src="./assets/img/103386 (1).png"
                alt="Dente"
                class="card-icon"
              />
            </button>
            <button id="card-exames">
              <span class="cardtext">Agendar exame</span>
              <img
                src="./assets/img/261-2614450_airport-clip-art-black-and-white-download-chemical-reactions-clipart-black-and (1).png"
                alt="Exame"
                class="card-icon-potion"
              />
            </button>
          </div>

          <section class="especialidades">
            <div class="lado masculino" id="especialidades-lado-1"></div>
            <img
              src="./assets/img/simbolos-de-genero-iconografia-masculina-e-feminina-para-diversas-aplicacoes_1281599-55652 (1).png"
              alt="Símbolo de gênero"
              class="simbolo-genero"
            />
            <div class="lado feminino" id="especialidades-lado-2"></div>
          </section>
        </main>
      </main>
    </div>
  </body>
</html>
