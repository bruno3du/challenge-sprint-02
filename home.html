<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <link rel="stylesheet" href="./styles/home.css" />
    <link rel="stylesheet" href="./styles/tokens.css" />
    <script src="./script/home.js"></script>

    <title>Home</title>
  </head>

  <body>
    <div class="d-flex min-vh-100">
      <!-- Side nav rail -->
      <aside class="nav-rail d-flex flex-column align-items-center gap-2 py-3">
        <div class="nav-brand mb-3">E</div>
        <a
          class="nav-item active"
          href="#"
          title="Dashboard"
          aria-label="Dashboard"
        >
          <i class="bi bi-grid-fill"></i>
        </a>
        <a class="nav-item" href="#" title="Histórico" aria-label="Histórico">
          <i class="bi bi-clock-history"></i>
        </a>
        <a class="nav-item" href="#" title="Pessoas" aria-label="Pessoas">
          <i class="bi bi-people"></i>
        </a>
        <a class="nav-item" href="#" title="Mensagens" aria-label="Mensagens">
          <i class="bi bi-chat-left"></i>
        </a>
        <a
          class="nav-item"
          href="#"
          title="Configurações"
          aria-label="Configurações"
        >
          <i class="bi bi-gear"></i>
        </a>
      </aside>

      <main class="flex-fill d-flex flex-column min-w-0">
        <!-- Topbar -->
        <header class="topbar d-flex align-items-center gap-3 px-5">
          <div class="flex-grow-1">
            <h1 class="m-0">Home</h1>
            <div class="text-muted-ink small">Terça, 17 de julho de 2026</div>
          </div>
          <input
            type="text"
            class="input input-search"
            placeholder="Pesquisar"
            aria-label="Pesquisar"
          />
          <button
            type="button"
            class="btn btn-icon rounded-pill"
            aria-label="Notificações"
          >
            <i class="bi bi-bell"></i>
          </button>
          <button id="dark-toggle" class="btn btn-icon rounded-pill" aria-label="Alternar tema">
  <i class="bi bi-moon"></i>
</button>
          <div class="avatar avatar-gradient">B</div>
        </header>
<div class="search-bar" bis_skin_checked="1">
    <i class="fas fa-search"></i>
    <img src="./assets/img/pngtree-magnifying-glass-icon-image_1128382.png" alt="lupa" class="search-icon">
    
    <input type="text" placeholder="Search — find a Doctor / Dentist">
  </div>
            <!-- MAIN CONTENT -->
    <main id="content-fundo">
      <h2 class="contenth2">What would you like to book?</h2>
<div class="opcoes" bis_skin_checked="1">
  <button id="card-consulta"><span>Book a consult</span>
    <img src="./assets/img/png-transparent-stethoscope-stethoscope-illustration-planner-icon-dr-logo-dr-appointment-icon.png" alt="Estecopio" class="card-icon">
  </button>
  <button id="card-cirurgia"><span>Book surgery</span>
    <img src="./assets/img/heart-icon-md (1).png" alt="coração" class="card-icon-heart">
  </button>

  <button id="card-odontologia"><span>Book dentist</span>
    <img src="./assets/img/103386 (1).png" alt="dente" class="card-icon">
  </button>

  <button id="card-exames"><span>Book exam</span>
    <img src="./assets/img/261-2614450_airport-clip-art-black-and-white-download-chemical-reactions-clipart-black-and (1).png" alt="potion" class="card-icon-potion">
  </button>
</div>


      <section class="especialidades">
  <div class="lado masculino" bis_skin_checked="1">
    <button class="card">Urologist</button>
    <button class="card">Andrologist</button>
    <button class="card">Endocrinologist</button>
    <button class="card">Proctologist</button>
  </div>
  <img src="./assets/img/simbolos-de-genero-iconografia-masculina-e-feminina-para-diversas-aplicacoes_1281599-55652 (1).png" alt="genero" class="simbolo-genero">  
  <div class="lado feminino" bis_skin_checked="1">
    <button class="card">Obstetrician</button>
    <button class="card">Gynecologist</button>
    <button class="card">Mastologist</button>
    <button class="card">Uro-gynecologist</button>
  </div>
</section>
    </main>
  </body>
</html>
