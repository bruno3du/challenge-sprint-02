<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela Perfil</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  <link rel="stylesheet" href="styles/perfil.css">
</head>
<body>
  <div class="d-flex">
    <!-- Sidebar -->
    <aside class="sidebar d-flex flex-column align-items-center py-3">
      <a href="#" class="logo mb-4 text-decoration-none">E</a>
      <a href="#" class="icon-link mb-3"><i class="bi bi-grid-3x3-gap"></i></a>
      <a href="#" class="icon-link mb-3"><i class="bi bi-clock"></i></a>
      <a href="#" class="icon-link mb-3"><i class="bi bi-people"></i></a>
      <a href="#" class="icon-link active mb-3"><i class="bi bi-person"></i></a>
      <a href="#" class="icon-link mb-3"><i class="bi bi-gear"></i></a>
    </aside>

    <!-- Conteúdo principal -->
    <div class="flex-grow-1">
      <!-- Topbar -->
      <nav class="navbar bg-white border-bottom">
        <div class="container-fluid px-4">
          <div class="d-flex flex-column">
            <h1 class="h4 mb-0 fw-semibold">Perfil</h1>
            <small class="text-muted">Ter, 07 Jun 2026</small>
          </div>

          <div class="d-flex align-items-center gap-3">
            <div class="search-box d-flex align-items-center">
              <i class="bi bi-search text-secondary"></i>
              <input type="text" class="form-control border-0 shadow-none" placeholder="Search">
            </div>
            <a href="#" class="position-relative text-decoration-none">
              <i class="bi bi-bell fs-5 text-dark"></i>
              <span class="position-absolute top-0 start-100 translate-middle p-1 bg-danger border border-white rounded-circle"></span>
            </a>
            <a href="#" class="avatar-top text-decoration-none">A</a>
          </div>
        </div>
      </nav>

      <!-- Card de perfil -->
      <main class="container-fluid p-4">
        <div class="card border-0 shadow-sm rounded-3 overflow-hidden">
          <!-- Cabeçalho com gradiente -->
          <div class="card-header profile-header border-0 p-4">
            <div class="d-flex justify-content-between align-items-center">
              <div class="d-flex align-items-center">
                <div class="avatar me-3">A</div>
                <div>
                  <h2 class="h5 mb-1 fw-semibold text-black">Alexa Rawles</h2>
                  <p class="mb-0 text-black small">alexarawles@gmail.com</p>
                </div>
              </div>
              <button class="btn btn-primary d-flex align-items-center gap-2">
                <i class="bi bi-pencil"></i> Atualizar
              </button>
            </div>
          </div>

          <!-- Formulário -->
          <div class="card-body p-4">
            <form>
              <div class="row g-3">
                <div class="col-md-6">
                  <label for="firstName" class="form-label">Nome</label>
                  <input type="text" class="form-control" id="firstName" value="Alexa">
                </div>
                <div class="col-md-6">
                  <label for="lastName" class="form-label">Sobrenome</label>
                  <input type="text" class="form-control" id="lastName" value="Rawles">
                </div>
                <div class="col-md-6">
                  <label for="cpf" class="form-label">CPF</label>
                  <input type="text" class="form-control" id="cpf" value="000.000.000-00">
                </div>
                <div class="col-md-6">
                  <label for="rg" class="form-label">RG</label>
                  <input type="text" class="form-control" id="rg" value="00.000.000-0">
                </div>
                <div class="col-md-6">
                  <label for="dob" class="form-label">Data de Nascimento</label>
                  <input type="text" class="form-control" id="dob" value="12/04/1995">
                </div>
                <div class="col-md-6">
                  <label for="email" class="form-label">E-mail</label>
                  <input type="email" class="form-control" id="email" value="alexarawles@gmail.com">
                </div>
                <div class="col-md-6">
                  <label for="address" class="form-label">Endereço</label>
                  <input type="text" class="form-control" id="address" value="Av. Brasil, 1220">
                </div>
                <div class="col-md-6">
                  <label for="city" class="form-label">Cidade</label>
                  <input type="text" class="form-control" id="city" value="São Paulo">
                </div>
                <div class="col-md-6">
                  <label for="" class="form-label">Estado</label>
                  <input type="text" class="form-control" id="state" value="SP">
                </div>
                <div class="col-md-6">
                  <label for="zip" class="form-label">CEP</label>
                  <input type="text" class="form-control" id="zip" value="01310-100">
                </div>
              </div>
            </form>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

  <!-- Seus scripts -->
  <script src="scripts/formRegister.js"></script>
  <script src="scripts/perfil.js"></script>

</body>
</html>
