<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tela Perfil</title>
    <title>Perfil</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <!-- TOKENS -->
    <link rel="stylesheet" href="styles/tokens.css" />

    <!-- GLOBAL -->
    <link rel="stylesheet" href="styles/styles.css" />

    <!-- PERFIL -->
    <link rel="stylesheet" href="styles/perfil.css" />
  </head>

  <body>
    <div class="d-flex min-vh-100">
      <!-- SIDEBAR -->
      <aside class="nav-rail d-flex flex-column align-items-center gap-2 py-3">
        <div class="nav-brand mb-3">E</div>

        <a class="nav-item" href="home.html" title="Início" aria-label="Início">
          <i class="bi bi-house-door-fill"></i>
        </a>

        <a
          class="nav-item"
          href="agendamento.html"
          title="Agendar"
          aria-label="Agendar"
        >
          <i class="bi bi-calendar-plus"></i>
        </a>

        <a
          class="nav-item"
          href="consultas.html"
          title="Consultas"
          aria-label="Consultas"
        >
          <i class="bi bi-clock-history"></i>
        </a>

        <a
          class="nav-item"
          href="rewards.html"
          title="Recompensas"
          aria-label="Recompensas"
        >
          <i class="bi bi-gift"></i>
        </a>

        <a
          class="nav-item active"
          href="perfil.html"
          title="Perfil"
          aria-label="Perfil"
        >
          <i class="bi bi-person-circle"></i>
        </a>
      </aside>

      <!-- MAIN -->
      <main class="flex-fill d-flex flex-column min-w-0">
        <!-- TOPBAR -->
        <header class="topbar d-flex align-items-center gap-3 px-5">
          <div class="flex-grow-1">
            <h1 class="m-0">Perfil</h1>

            <div class="text-muted-ink small">Terça, 17 de julho de 2026</div>
          </div>

          <input
            type="text"
            class="input input-search"
            placeholder="Pesquisar"
          />

          <button type="button" class="btn btn-icon rounded-pill">
            <i class="bi bi-bell"></i>
          </button>

          <div class="avatar avatar-gradient">A</div>
        </header>

        <!-- PAGE -->
        <div class="px-5 pb-5">
          <!-- CARD -->
          <section class="profile-card">
            <!-- HEADER -->
            <div class="profile-header">
              <div class="profile-user">
                <div class="profile-avatar">A</div>

                <div>
                  <h2>Alexa Rawles</h2>

                  <p>alexarawles@gmail.com</p>
                </div>
              </div>

              <button 
                type="button" id="update-profile-btn" class="btn btn-primary profile-btn">
                <i class="bi bi-pencil"></i>
                Atualizar
              </button>
            </div>

            <!-- BODY -->
            <div class="profile-body">
              <div class="profile-grid">
                <div class="form-group field">
                  <label for="firstName">Nome</label>
                  <input type="text" id="firstName" class="input" value="Alexa" />
                  <small class="field-error"></small>
                </div>

                <div class="form-group field">
                  <label>Sobrenome</label>
                  <input type="text" id="lastName" class="input" value="Rawles" />
                  <small class="field-error"></small>
                </div>

                <div class="form-group field">
                  <label for="cpf">CPF</label>
                  <input type="text" id="cpf" class="input" value="000.000.000-00" />
                  <small class="field-error"></small>
                </div>

                <div class="form-group field">
                  <label for="rg">RG</label>
                  <input type="text" class="input" id="rg" value="00.000.000-0" />
                  <small class="field-error"></small>
                </div>

                <div class="form-group field">
                  <label for="dob">Data de Nascimento</label>
                  <input type="date" id="dob" class="input" />
                  <small class="field-error"></small>
                </div>

                <div class="form-group field">
                  <label for="email">E-mail</label>
                  <input type="email" class="input" id="email" value="alexarawles@gmail.com" />
                  <small class="field-error"></small>
                </div>

                <div class="form-group field">
                  <label for="address">Endereço</label>
                  <input type="text" class="input" id="address" value="Av. Brasil, 1220" />
                  <small class="field-error"></small>
                </div>

                <div class="form-group field">
                  <label for="city">Cidade</label>
                  <input type="text" class="input" id="city" value="São Paulo" />
                  <small class="field-error"></small>
                </div>

                <div class="form-group field">
                  <label for="state">Estado</label>
                  <select id="state" class="input">
                  <option value="">Selecione</option>

                  <option value="AC">AC</option>
                  <option value="AL">AL</option>
                  <option value="AP">AP</option>
                  <option value="AM">AM</option>
                  <option value="BA">BA</option>

                  <option value="CE">CE</option>
                  <option value="DF">DF</option>
                  <option value="ES">ES</option>
                  <option value="GO">GO</option>
                  <option value="MA">MA</option>

                  <option value="MT">MT</option>
                  <option value="MS">MS</option>
                  <option value="MG">MG</option>
                  <option value="PA">PA</option>
                  <option value="PB">PB</option>

                  <option value="PR">PR</option>
                  <option value="PE">PE</option>
                  <option value="PI">PI</option>
                  <option value="RJ">RJ</option>
                  <option value="RN">RN</option>

                  <option value="RS">RS</option>
                  <option value="RO">RO</option>
                  <option value="RR">RR</option>
                  <option value="SC">SC</option>
                  <option value="SP">SP</option>

                  <option value="SE">SE</option>
                  <option value="TO">TO</option>

                  </select>
                  <small class="field-error"></small>
                </div>

                <div class="form-group field">
                  <label for="zip">CEP</label>
                  <input type="text" class="input" id="zip" value="01310-100" />
                  <small class="field-error"></small>
                </div>
                </div>
              </div>
            </div>
          </section>
        </div>
      </main>
    </div>

<script src="scripts/saveUpdateDelete.js"></script>
<script src="scripts/formRegister.js"></script>
<script src="scripts/perfil.js"></script>

  </body>
</html>
