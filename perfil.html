<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tela Perfil</title>
    <title>Perfil</title>

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <!-- Bootstrap Icons -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <!-- TOKENS -->
    <link rel="stylesheet" href="styles/tokens.css" />

    <!-- GLOBAL -->
    <link rel="stylesheet" href="styles/styles.css" />

    <!-- PERFIL -->
    <link rel="stylesheet" href="styles/perfil.css" />
  </head>

  <body>
    <div class="d-flex min-vh-100">
      <!-- SIDEBAR -->
      <aside class="nav-rail d-flex flex-column align-items-center gap-2 py-3">
        <div class="nav-brand mb-3">E</div>

        <a class="nav-item" href="home.html" title="Início" aria-label="Início">
          <i class="bi bi-house-door-fill"></i>
        </a>

        <a
          class="nav-item"
          href="agendamento.html"
          title="Agendar"
          aria-label="Agendar"
        >
          <i class="bi bi-calendar-plus"></i>
        </a>

        <a
          class="nav-item"
          href="consultas.html"
          title="Consultas"
          aria-label="Consultas"
        >
          <i class="bi bi-clock-history"></i>
        </a>

        <a
          class="nav-item"
          href="rewards.html"
          title="Recompensas"
          aria-label="Recompensas"
        >
          <i class="bi bi-gift"></i>
        </a>

        <a
          class="nav-item active"
          href="perfil.html"
          title="Perfil"
          aria-label="Perfil"
        >
          <i class="bi bi-person-circle"></i>
        </a>
      </aside>

      <!-- MAIN -->
      <main class="flex-fill d-flex flex-column min-w-0">
        <!-- TOPBAR -->
        <header class="topbar d-flex align-items-center gap-3 px-5">
          <div class="flex-grow-1">
            <h1 class="m-0">Perfil</h1>

            <div class="text-muted-ink small">Terça, 17 de julho de 2026</div>
          </div>

          <input
            type="text"
            class="input input-search"
            placeholder="Pesquisar"
          />

          <button type="button" class="btn btn-icon rounded-pill">
            <i class="bi bi-bell"></i>
          </button>

          <div class="avatar avatar-gradient">A</div>
        </header>

        <!-- PAGE -->
        <div class="px-5 pb-5">
          <!-- CARD -->
          <section class="profile-card">
            <!-- HEADER -->
            <div class="profile-header">
              <div class="profile-user">
                <div class="profile-avatar" id="profileAvatar">A</div>

                <div>
                  <h2 id="profileName">Alexa Rawles</h2>

                  <p id="profileEmail">alexarawles@gmail.com</p>
                </div>
              </div>

              <button
                type="button"
                class="btn btn-primary profile-btn"
                id="btnAtualizar"
              >
                <i class="bi bi-pencil"></i>
                Atualizar
              </button>
            </div>

            <!-- BODY -->
            <div class="profile-body">
              <div class="profile-grid">
                <div class="form-group">
                  <label for="firstName">Nome</label>
                  <input id="firstName" type="text" class="input" />
                </div>

                <div class="form-group">
                  <label for="lastName">Sobrenome</label>
                  <input id="lastName" type="text" class="input" />
                </div>

                <div class="form-group">
                  <label for="cpf">CPF</label>
                  <input id="cpf" type="text" class="input" />
                </div>

                <div class="form-group">
                  <label for="rg">RG</label>
                  <input id="rg" type="text" class="input" />
                </div>

                <div class="form-group">
                  <label for="dob">Data de Nascimento</label>
                  <input id="dob" type="text" class="input" />
                </div>

                <div class="form-group">
                  <label for="email">E-mail</label>
                  <input id="email" type="email" class="input" />
                </div>

                <div class="form-group">
                  <label for="address">Endereço</label>
                  <input id="address" type="text" class="input" />
                </div>

                <div class="form-group">
                  <label for="city">Cidade</label>
                  <input id="city" type="text" class="input" />
                </div>

                <div class="form-group">
                  <label for="state">Estado</label>
                  <input id="state" type="text" class="input" />
                </div>

                <div class="form-group">
                  <label for="zip">CEP</label>
                  <input id="zip" type="text" class="input" />
                </div>
              </div>
            </div>
          </section>
        </div>
      </main>
    </div>

    <!-- TOAST -->
    <div
      class="toast-container position-fixed top-0 end-0 p-3"
      style="z-index: 1080"
    >
      <div
        id="perfilToast"
        class="toast align-items-center text-white bg-success border-0"
        role="alert"
        aria-live="assertive"
        aria-atomic="true"
      >
        <div class="d-flex">
          <div class="toast-body" id="perfilToastBody">
            Perfil atualizado com sucesso!
          </div>
          <button
            type="button"
            class="btn-close btn-close-white me-2 m-auto"
            data-bs-dismiss="toast"
            aria-label="Fechar"
          ></button>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="scripts/saveUpdateDelete.js"></script>
    <script src="scripts/formRegister.js"></script>
    <script src="scripts/perfil.js"></script>
  </body>
</html>
