<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
      crossorigin="anonymous"
    ></script>
    <link rel="stylesheet" href="./styles/tokens.css" />
    <link rel="stylesheet" href="./styles/styles.css" />

    <title>Agendamento</title>
  </head>

  <body>
    <div class="d-flex min-vh-100">
      <!-- Side nav rail -->
      <aside class="nav-rail d-flex flex-column align-items-center gap-2 py-3">
        <div class="nav-brand mb-3">E</div>
        <a class="nav-item" href="./home.html" title="Início" aria-label="Início">
          <i class="bi bi-house-door-fill"></i>
        </a>
        <a class="nav-item active" href="./agendamento.html" title="Agendar" aria-label="Agendar">
          <i class="bi bi-calendar-plus"></i>
        </a>
        <a class="nav-item" href="./consultas.html" title="Consultas" aria-label="Consultas">
          <i class="bi bi-clock-history"></i>
        </a>
        <a class="nav-item" href="./rewards.html" title="Recompensas" aria-label="Recompensas">
          <i class="bi bi-gift"></i>
        </a>
        <a class="nav-item" href="./perfil.html" title="Perfil" aria-label="Perfil">
          <i class="bi bi-person-circle"></i>
        </a>
      </aside>

      <main class="flex-fill d-flex flex-column min-w-0">
        <!-- Topbar -->
        <header class="topbar d-flex align-items-center gap-3 px-5">
          <div class="flex-grow-1">
            <h1 class="m-0">Agendamento</h1>
            <div class="text-muted-ink small" id="topbar-date"></div>
          </div>
          <input
            type="text"
            class="input input-search"
            placeholder="Pesquisar"
            aria-label="Pesquisar"
          />
          <button
            type="button"
            class="btn btn-icon rounded-pill"
            aria-label="Notificações"
          >
            <i class="bi bi-bell"></i>
          </button>
          <div class="avatar avatar-gradient">B</div>
        </header>

        <!-- Page body -->
        <div class="px-5 pb-5">
          <!-- Hero band (gradient strip) -->
          <section class="hero-band mb-4"></section>

          <!-- Filter / period row -->
          <div class="d-flex align-items-center justify-content-between mb-4">
            <div class="d-flex align-items-center gap-2">
              <button
                type="button"
                class="btn btn-secondary"
                id="btn-abrir-filtro"
                data-bs-toggle="modal"
                data-bs-target="#filterModal"
              >
                <i class="bi bi-funnel"></i> Filtrar
              </button>
              <span
                id="filtro-especialidade"
                class="badge text-bg-light border d-none align-items-center gap-2"
              >
                <span>Especialidade: <strong id="filtro-especialidade-nome"></strong></span>
                <a href="#" id="limpar-filtro-especialidade" aria-label="Limpar especialidade" class="text-decoration-none">
                  <i class="bi bi-x-lg"></i>
                </a>
              </span>
              <span
                id="filtro-periodo"
                class="badge text-bg-light border d-none align-items-center gap-2"
              >
                <span>Período: <strong id="filtro-periodo-nome"></strong></span>
                <a href="#" id="limpar-filtro-periodo" aria-label="Limpar período" class="text-decoration-none">
                  <i class="bi bi-x-lg"></i>
                </a>
              </span>
            </div>
            <div class="d-flex align-items-center gap-3">
              <label class="form-label m-0 small text-muted-ink" for="cal-month"
                >Mês</label
              >
              <div class="select-wrap cal-select-month">
                <select id="cal-month" class="select"></select>
              </div>
              <label class="form-label m-0 small text-muted-ink" for="cal-year"
                >Ano</label
              >
              <div class="select-wrap cal-select-year">
                <select id="cal-year" class="select"></select>
              </div>
            </div>
          </div>

          <!-- Calendar table -->
          <div
            class="cal-table border rounded overflow-hidden bg-white"
            id="cal-table"
          >
            <div class="cal-head">
              <div class="cal-head-cell">Dom</div>
              <div class="cal-head-cell">Seg</div>
              <div class="cal-head-cell">Ter</div>
              <div class="cal-head-cell">Qua</div>
              <div class="cal-head-cell">Qui</div>
              <div class="cal-head-cell">Sex</div>
              <div class="cal-head-cell">Sáb</div>
            </div>

            <div class="cal-body" id="cal-body"></div>
          </div>
        </div>
      </main>
    </div>

    <!-- Filter Modal -->
    <div
      class="modal fade"
      id="filterModal"
      tabindex="-1"
      aria-labelledby="filterModalTitle"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered schedule-modal">
        <div class="modal-content schedule-card border-0 p-4 shadow-lg">
          <div class="d-flex align-items-center justify-content-between mb-2">
            <h2 id="filterModalTitle" class="schedule-title m-0">
              Filtrar agendamento
            </h2>
            <button
              type="button"
              class="btn btn-icon btn-ghost-icon"
              data-bs-dismiss="modal"
              aria-label="Fechar"
            >
              <i class="bi bi-x-lg"></i>
            </button>
          </div>
          <p class="text-muted-ink small mb-2">Especialidade</p>
          <div
            id="filter-especialidades-list"
            class="d-flex flex-column gap-2 mb-4"
            role="radiogroup"
            aria-label="Especialidades"
          ></div>

          <p class="text-muted-ink small mb-2">Período</p>
          <div
            id="filter-periodo-list"
            class="d-flex flex-column gap-2 mb-4"
            role="radiogroup"
            aria-label="Período"
          ></div>

          <div class="row g-3">
            <div class="col-6 d-grid">
              <button
                type="button"
                class="btn btn-secondary"
                id="btn-limpar-filtro"
              >
                Limpar
              </button>
            </div>
            <div class="col-6 d-grid">
              <button
                type="button"
                class="btn btn-primary"
                id="btn-aplicar-filtro"
              >
                Aplicar
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Schedule Modal -->
    <div
      class="modal fade"
      id="scheduleModal"
      tabindex="-1"
      aria-labelledby="scheduleModalTitle"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered schedule-modal">
        <div class="modal-content schedule-card border-0 p-4 shadow-lg">
          <div class="d-flex align-items-center justify-content-between mb-2">
            <h2 id="scheduleModalTitle" class="schedule-title m-0">
              Agendar horário
            </h2>
            <button
              type="button"
              class="btn btn-icon btn-ghost-icon"
              data-bs-dismiss="modal"
              aria-label="Fechar"
            >
              <i class="bi bi-x-lg"></i>
            </button>
          </div>
          <p class="text-muted-ink small mb-4" id="scheduleModalSubtitle">Horários disponíveis</p>

          <div
            id="schedule-slots-list"
            class="d-flex flex-column gap-2 mb-4"
            role="radiogroup"
            aria-label="Horários disponíveis"
          ></div>

          <div class="row g-3">
            <div class="col-6 d-grid">
              <button
                type="button"
                class="btn btn-secondary"
                data-bs-dismiss="modal"
              >
                Fechar
              </button>
            </div>
            <div class="col-6 d-grid">
              <button type="button" class="btn btn-primary" id="btn-confirmar-agendamento">Agendar</button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="./scripts/saveUpdateDelete.js"></script>
    <script src="./scripts/common.js"></script>
    <script src="./scripts/agendamento.js"></script>
  </body>
</html>
