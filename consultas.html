<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
    crossorigin="anonymous"
  />
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
  />
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"
  ></script>
    <link rel="stylesheet" href="./styles/tokens.css" />
    <link rel="stylesheet" href="./styles/consultas.css" />
    <link rel="stylesheet" href="./styles/styles.css" />

  <title>Consultas</title>
  </head>

  <body>
    <div class="d-flex min-vh-100">
      <!-- Side nav rail -->
      <aside class="nav-rail d-flex flex-column align-items-center gap-2 py-3">
        <div class="nav-brand mb-3">E</div>
        <a class="nav-item" href="./home.html" title="Início" aria-label="Início">
          <i class="bi bi-house-door-fill"></i>
        </a>
        <a class="nav-item" href="./agendamento.html" title="Agendar" aria-label="Agendar">
          <i class="bi bi-calendar-plus"></i>
        </a>
        <a class="nav-item active" href="./consultas.html" title="Consultas" aria-label="Consultas">
          <i class="bi bi-clock-history"></i>
        </a>
        <a class="nav-item" href="./rewards.html" title="Recompensas" aria-label="Recompensas">
          <i class="bi bi-gift"></i>
        </a>
        <a class="nav-item" href="./perfil.html" title="Perfil" aria-label="Perfil">
          <i class="bi bi-person-circle"></i>
        </a>
      </aside>

      <main class="flex-fill d-flex flex-column min-w-0">
        <!-- Topbar -->
        <header class="topbar d-flex align-items-center gap-3 px-5">
          <div class="flex-grow-1">
            <h1 class="m-0">Consultas</h1>
            <div class="text-muted-ink small">Terça, 17 de julho de 2026</div>
          </div>
          <input
            type="search"
            class="input input-search"
            id="busca-consultas"
            placeholder="Buscar por médico, especialidade ou endereço"
            aria-label="Buscar consultas"
          />
          <button
            type="button"
            class="btn btn-icon rounded-pill"
            aria-label="Notificações"
          >
            <i class="bi bi-bell"></i>
          </button>
          <div class="avatar avatar-gradient">B</div>
        </header>

        <!-- Page body -->
        <div class="px-5 pb-5">
          <!-- Hero band (gradient strip) -->
          <section class="hero-band mb-4"></section>

          <!-- Filter / period row -->
          <div class="d-flex align-items-center justify-content-between mb-4 gap-3 flex-wrap">
            <div class="d-flex align-items-center gap-2 flex-wrap">
              <button
                type="button"
                class="btn btn-secondary"
                id="btn-abrir-filtro-consultas"
                data-bs-toggle="modal"
                data-bs-target="#filterConsultasModal"
              >
                <i class="bi bi-funnel"></i> Filtrar
              </button>
              <div id="chips-filtros-consultas" class="d-flex align-items-center gap-2 flex-wrap"></div>
            </div>
            <div class="d-flex align-items-center gap-3">
              <label class="form-label m-0 small text-muted-ink" for="cal-month"
                >Mês</label
              >
              <div class="select-wrap cal-select-month">
                <select id="cal-month" class="select">
                  <option>Julho</option>
                  <option>Agosto</option>
                  <option>Setembro</option>
                  <option>Outubro</option>
                </select>
              </div>
              <label class="form-label m-0 small text-muted-ink" for="cal-year"
                >Ano</label
              >
              <div class="select-wrap cal-select-year">
                <select id="cal-year" class="select">
                  <option>2026</option>
                  <option>2027</option>
                </select>
              </div>
            </div>
          </div>

      <!-- Tabela de Agendados -->
      <table class="container-table-agendados">
        <thead class="cabecalho">
          
            <th>Especialidade</th>
            <th>Médico</th>
            <th>Horário agendado</th>
            <th>Status</th>
            <th>Endereço</th>
            <th class="col-acoes"></th>
          
        </thead>
        <tbody id="consultas-tbody"> 
          
        </tbody>

      </table>
      <nav aria-label="Paginação de consultas" class="mt-3">
        <ul id="consultas-pagination" class="pagination justify-content-end m-0"></ul>
      </nav>
    </div>
    </main>

    <!-- Filter Modal -->
    <div
      class="modal fade"
      id="filterConsultasModal"
      tabindex="-1"
      aria-labelledby="filterConsultasModalTitle"
      aria-hidden="true"
    >
      <div class="modal-dialog modal-dialog-centered schedule-modal">
        <div class="modal-content schedule-card border-0 p-4 shadow-lg">
          <div class="d-flex align-items-center justify-content-between mb-2">
            <h2 id="filterConsultasModalTitle" class="schedule-title m-0">
              Filtrar consultas
            </h2>
            <button
              type="button"
              class="btn btn-icon btn-ghost-icon"
              data-bs-dismiss="modal"
              aria-label="Fechar"
            >
              <i class="bi bi-x-lg"></i>
            </button>
          </div>

          <p class="text-muted-ink small mb-2 mt-3">Status</p>
          <div id="filtro-cons-status" class="d-flex flex-wrap gap-2 mb-3"></div>

          <p class="text-muted-ink small mb-2">Período</p>
          <div id="filtro-cons-periodo" class="d-flex flex-wrap gap-2 mb-3"></div>

          <p class="text-muted-ink small mb-2">Especialidade</p>
          <div class="select-wrap mb-3">
            <select id="filtro-cons-especialidade" class="select">
              <option value="">Todas</option>
            </select>
          </div>

          <div class="row g-3 mt-2">
            <div class="col-6 d-grid">
              <button type="button" class="btn btn-secondary" id="btn-limpar-filtros-consultas">
                Limpar
              </button>
            </div>
            <div class="col-6 d-grid">
              <button type="button" class="btn btn-primary" id="btn-aplicar-filtros-consultas">
                Aplicar
              </button>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="./scripts/saveUpdateDelete.js"></script>
    <script src="./scripts/common.js"></script>
    <script src="./scripts/consultas.js"></script>
  </body>
</html>
