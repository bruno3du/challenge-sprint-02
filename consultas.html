<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
    rel="stylesheet"
    integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
    crossorigin="anonymous"
  />
  <link
    rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
  />
  <script
    src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
    crossorigin="anonymous"
  ></script>
    <link rel="stylesheet" href="styles/tokens.css" />
    <link rel="stylesheet" href="styles/consultas.css" />
    <link rel="stylesheet" href="styles/styles.css" />

  <title>Consultas</title>
  </head>

  <body>
    <div class="d-flex min-vh-100">
      <!-- Side nav rail -->
      <aside class="nav-rail d-flex flex-column align-items-center gap-2 py-3">
        <div class="nav-brand mb-3">E</div>
        <a class="nav-item" href="home.html" title="Início" aria-label="Início">
          <i class="bi bi-house-door-fill"></i>
        </a>
        <a class="nav-item" href="agendamento.html" title="Agendar" aria-label="Agendar">
          <i class="bi bi-calendar-plus"></i>
        </a>
        <a class="nav-item active" href="consultas.html" title="Consultas" aria-label="Consultas">
          <i class="bi bi-clock-history"></i>
        </a>
        <a class="nav-item" href="rewards.html" title="Recompensas" aria-label="Recompensas">
          <i class="bi bi-gift"></i>
        </a>
        <a class="nav-item" href="perfil.html" title="Perfil" aria-label="Perfil">
          <i class="bi bi-person-circle"></i>
        </a>
      </aside>

      <main class="flex-fill d-flex flex-column min-w-0">
        <!-- Topbar -->
        <header class="topbar d-flex align-items-center gap-3 px-5">
          <div class="flex-grow-1">
            <h1 class="m-0">Consultas</h1>
            <div class="text-muted-ink small">Terça, 17 de julho de 2026</div>
          </div>
          <input
            type="text"
            class="input input-search"
            placeholder="Pesquisar"
            aria-label="Pesquisar"
          />
          <button
            type="button"
            class="btn btn-icon rounded-pill"
            aria-label="Notificações"
          >
            <i class="bi bi-bell"></i>
          </button>
          <div class="avatar avatar-gradient">B</div>
        </header>

        <!-- Page body -->
        <div class="px-5 pb-5">
          <!-- Hero band (gradient strip) -->
          <section class="hero-band mb-4"></section>

          <!-- Filter / period row -->
          <div class="d-flex align-items-center justify-content-between mb-4">
            <button type="button" class="btn btn-secondary">
              <i class="bi bi-funnel"></i> Filtrar
            </button>
            <div class="d-flex align-items-center gap-3">
              <label class="form-label m-0 small text-muted-ink" for="cal-month"
                >Mês</label
              >
              <div class="select-wrap cal-select-month">
                <select id="cal-month" class="select">
                  <option>Julho</option>
                  <option>Agosto</option>
                  <option>Setembro</option>
                  <option>Outubro</option>
                </select>
              </div>
              <label class="form-label m-0 small text-muted-ink" for="cal-year"
                >Ano</label
              >
              <div class="select-wrap cal-select-year">
                <select id="cal-year" class="select">
                  <option>2026</option>
                  <option>2027</option>
                </select>
              </div>
            </div>
          </div>

      <!-- Tabela de Agendados -->
      <table class="container-table-agendados">
        <thead class="cabecalho">
          
            <th>Especialidade</th>
            <th>Médico</th>
            <th>Horário agendado</th>
            <th>Status</th>
            <th>Endereço</th>
            <th></th>
          
        </thead>
        <tbody id="consultas-tbody"> 
          
        </tbody>

      </table>
    </div>
    <script src ="scripts/saveUpdateDelete.js" ></script>
    <script src="scripts/consultas.js"></script>
    </main>
  </body>
</html>
